name: walltryofTac
on:
   push:
   branches: [main]

jobs:
    deploy:
    runs-on: ubuntu-latest
    step:
    -uses: actions/checkout@v4
    -uses: actions/setup-node@v4
         node-version: 20
    -run: npm install -g wrangler
    -run: wrangler deploy
    env:
        CFATK: ${{CTK}}$
        CFACT: ${{CAT}}$
